<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Akademik UMM — Jadwal Kuliah</title>
<style>
:root{--p:#2563EB;--pl:#EFF6FF;--bg:#F8FAFC;--bd:#E2E8F0;--t1:#0F172A;--t2:#64748B;--ok:#16A34A;--okl:#DCFCE7;--wn:#D97706;--wnl:#FEF3C7;--dg:#DC2626;--dgl:#FEE2E2}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--t1)}.w{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}h1{font-size:24px;margin:0}small{display:block;color:var(--t2);font-size:13px}
button{font:inherit;border:1px solid var(--bd);background:#fff;border-radius:8px;height:36px;padding:0 14px;cursor:pointer;font-weight:600}button.pri{background:var(--p);border-color:var(--p);color:#fff}button:disabled{opacity:.5;cursor:not-allowed}button.on{background:var(--pl);color:var(--p);border-color:var(--p)}:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.demo{background:var(--wnl);border:1px dashed var(--wn);border-radius:8px;padding:8px 12px;margin-bottom:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.demo span{flex:1;min-width:200px}
.ban{background:var(--wnl);border:1px solid var(--wn);border-radius:12px;padding:16px;margin-bottom:16px}.ban ul{margin:8px 0;padding-left:20px}.ban p{margin:8px 0}
.tabs{display:flex;gap:8px;margin-bottom:12px}.card{background:#fff;border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.r{display:grid;grid-template-columns:90px 130px 1.6fr 130px 1.4fr;gap:12px;padding:12px 16px;border-top:1px solid var(--bd);align-items:center}.r.h{background:#F1F5F9;color:var(--t2);font-weight:600;border-top:0}.r.bad{background:var(--dgl);border-left:4px solid var(--dg)}
.tag{background:var(--dg);color:#fff;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:600}.ok{color:var(--ok);font-weight:600}
.alt{background:#fff;padding:12px 16px 16px 24px;border-top:1px dashed var(--dg)}.alt h3{font-size:14px;margin:0 0 8px}.ai{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--bd);flex-wrap:wrap}.ai div{flex:1;min-width:200px}
.lg{padding:12px 16px;border-top:1px solid var(--bd)}.lg:first-child{border-top:0}.new{background:var(--dg);color:#fff;border-radius:999px;padding:0 8px;font-size:12px;margin-right:6px}.empty{padding:24px;text-align:center;color:var(--t2)}
.tw{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:9;max-width:340px}.toast{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--p);border-radius:8px;padding:12px;box-shadow:0 4px 12px #0f172a26}
@media(max-width:700px){.r{grid-template-columns:1fr}.r.h{display:none}.tw{left:16px;right:16px;max-width:none}h1{font-size:20px}}
</style></head><body><div class="w"><header><div><h1>Jadwal Kuliah</h1><small>Portal Akademik UMM · Suryo Wisodono Prayogo · Informatika semester 7</small></div><button id="bell" data-a="tab" data-t="r"></button></header>
<div class="demo"><span><b>Mode demo:</b> data jadwal adalah contoh (bukan data SIAKAD). Gunakan tombol berikut untuk mensimulasikan perubahan sepihak oleh BAA.</span><button class="pri" data-a="sim" id="sim">Simulasikan perubahan jadwal</button><button data-a="rst">Reset data demo</button></div>
<div id="ban"></div><div class="tabs"><button data-a="tab" data-t="j" id="tj">Jadwal</button><button data-a="tab" data-t="r" id="tr">Riwayat Perubahan</button></div><div class="card" id="main"></div></div><div class="tw" id="tw" aria-live="polite"></div>
<script>
const K='pj.v1',D=['Senin','Selasa','Rabu','Kamis','Jumat'],$=s=>document.querySelector(s),f=t=>t.replace(':','.'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C={1:['Basis Data','Dr. Andi Pratama',[['A','Rabu','08:40','10:20','GKB 1 R.201'],['B','Kamis','08:40','10:20','GKB 1 R.202'],['C','Jumat','13:00','14:40','GKB 1 R.203']]],
2:['Pemrograman Web','Budi Santoso, M.Kom.',[['A','Senin','08:40','10:20','GKB 2 R.101'],['B','Selasa','10:30','12:10','GKB 2 R.102'],['C','Rabu','13:00','14:40','GKB 2 R.103']]],
3:['Rekayasa Perangkat Lunak','Siti Rahma, M.T.',[['A','Selasa','08:40','10:20','GKB 3 R.301'],['B','Kamis','10:30','12:10','GKB 3 R.302'],['C','Jumat','08:40','10:20','GKB 3 R.303']]],
4:['Interaksi Manusia dan Komputer','Dr. Hendra Wijaya',[['A','Kamis','13:00','14:40','GKB 1 R.204'],['B','Senin','13:00','14:40','GKB 1 R.205'],['C','Rabu','10:30','12:10','GKB 1 R.206']]],
5:['Jaringan Komputer','Rina Kusuma, M.Kom.',[['A','Jumat','10:30','12:10','GKB 2 R.201'],['B','Selasa','13:00','14:40','GKB 2 R.202'],['C','Senin','10:30','12:10','GKB 2 R.203']]]};
const init=()=>({cur:{1:C[1][2][0],2:C[2][2][0],3:C[3][2][0],4:C[4][2][0],5:C[5][2][0]},log:[]});
let S;try{S=JSON.parse(localStorage.getItem(K))||init()}catch(e){S=init()}let tab='j';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Perubahan gagal disimpan. Periksa penyimpanan peramban.')}};
const ov=(a,b)=>a[1]===b[1]&&a[2]<b[3]&&b[2]<a[3],slot=s=>`${s[1]} ${f(s[2])}–${f(s[3])}`,dt=t=>new Date(t).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});
function toast(m){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=m;$('#tw').appendChild(d);setTimeout(()=>d.remove(),6000)}
function render(){const ids=Object.keys(S.cur).map(Number).sort((a,b)=>D.indexOf(S.cur[a][1])-D.indexOf(S.cur[b][1])||S.cur[a][2].localeCompare(S.cur[b][2])),cf={};
 ids.forEach(i=>{const p=ids.filter(j=>j!==i&&ov(S.cur[i],S.cur[j]));if(p.length)cf[i]=p});const pend=S.log.filter(l=>l.sys&&!l.ack),n=Object.keys(cf).length;
 $('#bell').textContent=`🔔 Notifikasi${pend.length?` (${pend.length} baru)`:''}`;$('#sim').disabled=S.log.some(l=>l.scn);$('#tj').className=tab==='j'?'on':'';$('#tr').className=tab==='r'?'on':'';
 $('#ban').innerHTML=pend.length||n?`<div class="ban" role="alert"><b>⚠ ${pend.length?'Jadwal kuliahmu berubah':'Ada jadwal yang bentrok'}</b>${pend.length?`<ul>${pend.map(l=>`<li>${esc(l.txt)}</li>`).join('')}</ul>`:''}${n?`<p>Bentrok terdeteksi pada: <b>${ids.filter(i=>cf[i]).map(i=>C[i][0]).join(', ')}</b>. Pilih sesi pengganti pada baris bertanda BENTROK. Jika kamu pindah lewat portal, presensi dicatat pada sesi yang kamu pilih.</p>`:''}${pend.length?'<button data-a="ack">Saya sudah membaca</button>':''}</div>`:'';
 if(tab==='r'){$('#main').innerHTML=S.log.length?[...S.log].reverse().map(l=>`<div class="lg">${l.sys&&!l.ack?'<span class="new">Baru</span>':''}${esc(l.txt)}<small>${dt(l.at)}</small></div>`).join(''):'<div class="empty">Belum ada perubahan jadwal.</div>';return}
 const alt=i=>{const o=C[i][2].map((a,k)=>({a,k})).filter(x=>x.a.join()!==S.cur[i].join());return `<div class="alt"><h3>Sesi pengganti (kelas paralel dosen yang sama: ${esc(C[i][1])})</h3>${o.map(({a,k})=>{const b=ids.filter(j=>j!==i&&ov(a,S.cur[j]));return `<div class="ai"><div><b>Kelas ${a[0]}</b> · ${slot(a)} · ${a[4]}${b.length?`<small>Bentrok dengan ${b.map(j=>C[j][0]).join(', ')}</small>`:'<small class="ok">Tidak bentrok</small>'}</div><button class="pri" data-a="mv" data-i="${i}" data-k="${k}"${b.length?' disabled':''}>Pindah ke sesi ini</button></div>`}).join('')}</div>`};
 $('#main').innerHTML=`<div class="r h"><div>Hari</div><div>Waktu</div><div>Mata Kuliah</div><div>Ruang</div><div>Status</div></div>`+ids.map(i=>{const s=S.cur[i],x=cf[i];return `<div class="r${x?' bad':''}"><div>${s[1]}</div><div>${f(s[2])}–${f(s[3])}</div><div><b>${C[i][0]}</b><small>${C[i][1]} · Kelas ${s[0]}</small></div><div>${s[4]}</div><div>${x?`<span class="tag">⚠ BENTROK</span> dengan ${x.map(j=>esc(C[j][0])).join(', ')}`:'<span class="ok">✓ Aman</span>'}</div></div>`+(x?alt(i):'')}).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='tab')tab=b.dataset.t;else if(a==='ack'){S.log.forEach(l=>l.ack=true);save()}
 else if(a==='sim'){const o=S.cur[2],n=['A','Rabu','08:40','10:20','GKB 2 R.101'],t=`Jadwal Pemrograman Web dipindahkan oleh sistem dari ${slot(o)} ke ${slot(n)}.`;S.cur[2]=n;S.log.push({at:Date.now(),sys:1,scn:1,ack:false,txt:t});
  const b2=Object.keys(S.cur).filter(j=>j!=2&&ov(n,S.cur[j]));if(b2.length)S.log.push({at:Date.now(),sys:1,ack:false,txt:`Bentrok terdeteksi: Pemrograman Web dengan ${b2.map(j=>C[j][0]).join(', ')}.`});save();toast('Notifikasi: '+t)}
 else if(a==='mv'){const i=+b.dataset.i,o=S.cur[i],n=C[i][2][+b.dataset.k];S.cur[i]=n;S.log.push({at:Date.now(),txt:`Kamu pindah kelas ${C[i][0]} dari Kelas ${o[0]} (${slot(o)}) ke Kelas ${n[0]} (${slot(n)}). Presensi dicatat pada sesi baru.`});save();toast('Sesi berhasil dipindahkan.')}
 else if(a==='rst'){S=init();localStorage.removeItem(K);tab='j'}render()});
render();
</script></body></html>
